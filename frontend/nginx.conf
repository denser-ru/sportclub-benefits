server {
  listen 80;
  server_name localhost;

  # Directory with the built static files
  root /usr/share/nginx/html;
  index index.html;

  location / {
    # This directive is key for SPA routing.
    # Nginx first tries to find a file at the exact URI ($uri),
    # then a directory ($uri/),
    # and if nothing is found, it serves /index.html.
    # React Router on the client side then handles the URL and displays the correct component.
    try_files $uri $uri/ /index.html;
  }
}