version: '3.8'

services:
  backend:
    command: uvicorn main:app --host 0.0.0.0 --port ${BACKEND_PORT} --reload --log-config log_config.yaml
    volumes:
      - ./backend:/app
    environment:
      # НОВАЯ СТРОКА: В режиме разработки включаем подробное логирование
      - LOG_LEVEL=DEBUG
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      target: development
    ports:
      - "${FRONTEND_PORT}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - app-network

  # Тестовые сервисы остаются здесь, так как они нужны для разработки в любом режиме
  backend-tests:
    build:
      context: ./backend
      target: builder
    volumes:
      - ./backend:/app
    command: tail -f /dev/null
    networks:
      - app-network

  frontend-tests:
    build:
      context: ./frontend
      target: development
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: tail -f /dev/null
    networks:
      - app-network

networks:
  app-network:
    external: false